# Isolated diagnostic overlay only. Never include this in a delivered app.
# Launch the test engine with its normal config first, then -conf this file.
# The official 0.83.1 API is primarily tested with the normal CPU core.
[cpu]
core = normal

[webserver]
webserver_enabled = on
webserver_bind_address = 127.0.0.1
webserver_port = 9090
